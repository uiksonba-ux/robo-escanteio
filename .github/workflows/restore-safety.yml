name: Restore safety checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [restore/execucao-antiga-assertividade-global]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile bot and execute isolated regression tests
        run: |
          python -m py_compile robo.py
          python -m unittest discover -s tests -p 'test_restore_safety.py' -v
