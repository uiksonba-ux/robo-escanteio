name: Android APK (PRACTICE)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/baskaraido-trader-android-practice

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: practice-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    if: github.ref == 'refs/heads/feature/baskaraido-trader-android-practice'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install Flask==3.1.0
      - name: Compile Python without starting the robot
        run: python -m compileall -q robo.py practice_band_config.py practice_control_store.py monitor_test_app.py
      - name: Security, five bands and synchronization tests (mocked connections)
        run: python -m unittest discover -v -s . -p 'test_*.py' 2>&1 | tee python-practice-tests.log
      - name: Existing robot regression suite (mocked worker and IQ Option)
        run: python -m unittest discover -v -s tests -p 'test_*.py' 2>&1 | tee python-regression-tests.log
      - name: Upload Python validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Python-validation-${{ github.sha }}
          path: python-*-tests.log
          if-no-files-found: warn
          retention-days: 30

  build:
    if: github.ref == 'refs/heads/feature/baskaraido-trader-android-practice'
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android unit tests, lint and APK compilation
        working-directory: android-app
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
      - name: Verify APK signature and record build provenance
        run: |
          mkdir -p apk-artifact
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-app/app/build/outputs/apk/debug/app-debug.apk | tee apk-artifact/SIGNATURE.txt
          cp android-app/app/build/outputs/apk/debug/app-debug.apk apk-artifact/Baskaraido-Trader-PRO-PRACTICE.apk
          git rev-parse HEAD > apk-artifact/COMMIT.txt
          printf '%s\n' "Branch: $GITHUB_REF_NAME" "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" 'Signing: Android debug key (development installation)' 'Build: Gradle 8.9; JDK 17; SDK 35; testDebugUnitTest lintDebug assembleDebug' > apk-artifact/BUILD.txt
          cd apk-artifact
          sha256sum Baskaraido-Trader-PRO-PRACTICE.apk > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Upload validated PRACTICE APK
        uses: actions/upload-artifact@v4
        with:
          name: Baskaraido-Trader-PRO-PRACTICE-${{ github.sha }}
          path: apk-artifact/
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-validation-${{ github.sha }}
          path: |
            android-app/app/build/reports/tests/
            android-app/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30
      - name: Publish build summary
        run: |
          printf '%s\n' 'APK PRACTICE validado: testes Android, lint e assinatura concluídos.' 'Assinatura de desenvolvimento (debug); nenhuma operação ou implantação foi iniciada.' "Commit: $GITHUB_SHA" 'Artefato: Baskaraido-Trader-PRO-PRACTICE-'"$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"


