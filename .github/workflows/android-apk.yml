name: Android APK (PRACTICE)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/baskaraido-trader-android-practice
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          command -v sdkmanager || true
          sdkmanager --version
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Baskaraido-Trader-PRACTICE-debug
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
