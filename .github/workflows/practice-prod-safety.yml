name: Production PRACTICE API Safety
on:
  push:
    branches:
      - feature/monitor-api-practice-prod-isolada
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_monitor_prod_static
