name: PRACTICE Monitor Tests
on:
  workflow_dispatch:
  push:
    branches:
      - feature/baskaraido-trader-android-practice
    paths:
      - 'monitor_test_app.py'
      - 'test_monitor_isolado.py'
      - '.github/workflows/practice-monitor-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'flask>=3,<4'
      - name: Run isolated authenticated monitoring tests
        run: python -m unittest -v test_monitor_isolado
