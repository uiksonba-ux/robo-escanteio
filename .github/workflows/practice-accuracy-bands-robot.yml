name: PRACTICE Robot Accuracy Bands
on:
  push:
    branches:
      - feature/baskaraido-trader-android-practice
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile robo.py
      - run: python -m unittest -v test_accuracy_bands_robot
