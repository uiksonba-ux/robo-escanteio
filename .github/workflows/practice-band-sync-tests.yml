name: PRACTICE Band Sync Tests
on:
  push:
    branches:
      - feature/baskaraido-trader-android-practice
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install flask
      - run: python -m unittest -v test_practice_band_sync
      - run: python -m py_compile monitor_test_app.py
